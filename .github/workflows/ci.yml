name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Verify build artifact integrity
        run: |
          test -f dist/index.html || { echo "dist/index.html not generated"; exit 1; }
          test -d dist/assets || { echo "dist/assets not generated"; exit 1; }
          echo "Build integrity verification passed successfully."
